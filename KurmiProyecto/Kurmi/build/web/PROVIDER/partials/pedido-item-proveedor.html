<div class="pedido-item">
    <img src="{{urlImg}}" onerror="this.src='{{imgDefault}}'"
         class="pedido-item__img" alt="{{nombre}}" />
    <span class="pedido-item__nombre">{{nombre}}</span>
    <span class="pedido-item__cant">x{{cantidad}}</span>
    <span class="pedido-item__precio-unit">${{precio}} c/u</span>
    <span class="pedido-item__precio">${{subtotal}}</span>
</div>
