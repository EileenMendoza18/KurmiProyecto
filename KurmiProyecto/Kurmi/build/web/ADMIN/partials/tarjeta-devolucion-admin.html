<div class="sol-card">
    <div class="sol-card__header">
        <div class="sol-card__header-left">
            <strong class="dev-id-pedido sol-card__id"></strong>
            <em class="dev-nombre-cliente sol-card__proveedor"></em>
        </div>
        <span class="sol-badge"></span>
    </div>

    <div class="sol-card__body">
        <p class="sol-card__fila"><span class="sol-card__etiq">Total del pedido:</span> <span class="dev-total sol-card__monto"></span></p>
        <p class="sol-card__fila"><span class="sol-card__etiq">Fecha pedido:</span> <span class="dev-fecha-pedido"></span></p>
        <p class="sol-card__fila"><span class="sol-card__etiq">Solicitud enviada:</span> <span class="dev-fecha-solicitud"></span></p>
        <p class="sol-card__fila dev-motivo"><span class="sol-card__etiq">Motivo del cliente:</span><br><span class="dev-motivo-texto"></span></p>

        <div class="dev-img-wrap" hidden>
            <span class="sol-card__etiq">Imagen de prueba:</span><br>
            <img src="" alt="Prueba devolución" onerror="this.style.display='none'" class="dev-img-prueba" />
        </div>

        <p class="sol-card__fila dev-respuesta" hidden>
            <span class="sol-card__etiq">Respuesta registrada:</span> <span class="dev-respuesta-texto"></span>
        </p>
        <p class="dev-fecha-respuesta" hidden></p>
    </div>

    <div class="sol-card__footer sol-card__footer--dev" hidden>
        <button class="sol-btn-responder">Responder</button>
    </div>
</div>
