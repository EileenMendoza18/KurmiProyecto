<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - Kurmi</title>
    <link rel="stylesheet" href="../style/tienda.css">
    <link rel="stylesheet" href="../style/modales.css">
    <link rel="stylesheet" href="../style/notificacion.css">
</head>
<body>
    <div class="div__body">
        <div id="header"></div>
        <div id="asideContainer"></div>
        <main class="tienda-main">
            <h1 class="tienda-titulo">Bienvenido a tu jardin de deseos</h1>

            <section class="buscador-seccion">
                <div class="buscador-contenedor">
                    <h2 class="buscador-texto">Busca lo que mas te guste</h2>
                    <div class="buscador-fila">
                        <div class="buscador-input-wrapper">
                            <input type="text" placeholder="¿Qué deseas probar hoy?..." class="buscador-input">
                            <img src="../../RESOURCES/img/search.png" alt="Buscar" class="buscador-icono">
                        </div>
                        <div class="buscador-filtros-extra">
                            <select id="filtroProveedorTienda" class="buscador-select-proveedor">
                                <option value="">Todos los proveedores</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <section class="products">
                <div id="contenedorTiendaCategorias"></div>
            </section>

            <div id="contenedorUltimos" class="oculto-inicial"></div>
            <div id="contenedorTestimonios" class="oculto-inicial"></div>
        </main>

        <div id="footer"></div>
    </div>

    <script src="../js/index.js" type="module"></script>
</body>
</html>
