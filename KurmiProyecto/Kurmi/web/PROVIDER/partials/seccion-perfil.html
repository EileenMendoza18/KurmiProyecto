<div class="seccion-header">
    <h2>Mi perfil</h2>
</div>

<div class="perfil-card">
    <div class="perfil-card__fila">
        <div class="perfil-campo">
            <label>Nombres</label>
            <input id="prov-nombres" type="text" readonly />
        </div>
        <div class="perfil-campo">
            <label>Apellidos</label>
            <input id="prov-apellidos" type="text" readonly />
        </div>
    </div>
    <div class="perfil-card__fila">
        <div class="perfil-campo">
            <label>Teléfono</label>
            <input id="prov-telefono" type="text" readonly />
        </div>
        <div class="perfil-campo">
            <label>Correo electrónico</label>
            <input id="prov-correo" type="text" readonly />
        </div>
    </div>
    <div class="perfil-card__fila">
        <div class="perfil-campo">
            <label>Fecha de nacimiento</label>
            <input id="prov-fecha" type="date" readonly />
        </div>
        <div class="perfil-campo">
            <label>Dirección</label>
            <input id="prov-direccion" type="text" readonly />
        </div>
    </div>

    <div class="perfil-card__acciones">
        <button class="btn-primario" id="btnActualizarPerfil">Actualizar datos</button>
        <button class="btn-cerrar-sesion" id="btnCerrarSesionProv">Cerrar sesión</button>
    </div>
</div>
