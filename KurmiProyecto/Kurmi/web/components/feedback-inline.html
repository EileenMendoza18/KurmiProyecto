<!--
    feedback-inline.html — Componente reutilizable: bloque de feedback
    ───────────────────────────────────────────────────────────────────
    Muestra mensajes de estado (cargando / ok / error) dentro de
    formularios o secciones sin recargar la página.

    Slot:
      · [FEEDBACK_ID]  → id del div (debe coincidir con el que usa mostrarFeedback())

    Estados aplicados por JS con mostrarFeedback(id, tipo, texto):
      · feedback--cargando   (spinner / azul)
      · feedback--ok         (verde)
      · feedback--error      (rojo)
      · feedback--oculto     (oculto por defecto)

    Uso:
        Incluir al final del .modal__body o de cualquier formulario.
        El JS lo gestiona completamente; este archivo solo define el nodo.
-->

<div id="[FEEDBACK_ID]" class="feedback feedback--oculto"></div>
