<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Kurmi</title>
    <link rel="stylesheet" href="../style/inicio.css">
    <link rel="stylesheet" href="../style/formularioPago.css">
</head>
<body>
    <div id="header"></div>

    <main class="pago-container" id="bloquePago">
        <h2>Detalles de tu Pedido</h2>
        
        <div class="resumen-producto" id="resumenCompra">
            Cargando producto elegido...
        </div>

        <form action="../../ProcesarCompraServlet" method="POST" id="formPago">
            
            <div class="form-group">
                <label for="nombre">Nombre de quien recibe:</label>
                <input type="text" name="nombre" id="nombre" required placeholder="Ej. Eileen Mendoza">
            </div>

            <div class="form-group">
                <label for="direccion">Dirección de Destino:</label>
                <input type="text" name="direccion" id="direccion" required placeholder="Ej. Calle 12 # 34-56">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono de Contacto:</label>
                <input type="tel" name="telefono" id="telefono" required placeholder="Ej. 3143615361">
            </div>

            <div class="form-group">
                <label for="idMetodo">Método de Pago:</label>
                <select name="idMetodo" id="idMetodo" required>
                    <option value="" disabled selected>Selecciona un método</option>
                    <option value="1">Efectivo</option>
                    <option value="2">Nequi</option>
                    
                </select>
            </div>

            <input type="hidden" name="totalPago" id="totalPago" value="0">
            <input type="hidden" name="idCarrito" id="idCarrito" value="0">
            <input type="hidden" name="idProducto" id="hiddenId">
            <input type="hidden" name="nombreProducto" id="hiddenNombre">
            <input type="hidden" name="precioProducto" id="hiddenPrecio">

            <div id="mensajeError" style="color: red; margin: 10px 0; display: none; font-weight: bold; text-align: center;"></div>

            <button type="submit" class="btn-pagar">Finalizar Compra</button>
        </form>
    </main>

    <div id="footer"></div>

    <script type="module" src="../js/formularioPago.js"></script>
</body>
</html>
