<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - Kurmi</title>
    <link rel="stylesheet" href="../style/pedidos.css">
</head>
<body>
    <div class="contenedor-principal">
        <div id="header"></div>

        <main class="pedidos-main">
            <h1 class="pedidos__titulo">Tus pedidos, <span id="nombreUsuario">...</span></h1>

            <!-- Filtros de estado -->
            <div class="pedidos__filtros">
                <button class="filtro__btn filtro__btn--activo" data-estado="1">Pendiente</button>
                <button class="filtro__btn" data-estado="en_proceso">En proceso</button>
                <button class="filtro__btn" data-estado="11">Cancelación Solicitada</button>
                <button class="filtro__btn" data-estado="8">Entregado</button>
                <button class="filtro__btn" data-estado="9">Devolución</button>
                <button class="filtro__btn" data-estado="3">Cancelado</button>
                <button class="filtro__btn filtro__btn--devoluciones" data-estado="devoluciones">
                   Mis devoluciones
                </button>
            </div>

            <!-- Grid de tarjetas de pedidos -->
            <div class="pedidos__grid" id="pedidosGrid">
                <p class="pedidos__cargando">Cargando pedidos...</p>
            </div>
        </main>

        <!-- Modal detalle del pedido -->
        <div class="modal__overlay hidden" id="modalOverlay">
            <div class="modal__card" id="modalCard">
                <button class="modal__cerrar" id="modalCerrar">✕</button>
                <h2 class="modal__titulo" id="modalTitulo">Detalle del pedido</h2>
                <p class="modal__fecha" id="modalFecha"></p>
                <div id="modalEstadoBadge" style="margin-bottom:14px;"></div>
                <div class="modal__productos" id="modalProductos"></div>
                <div class="modal__footer" id="modalFooter"></div>
            </div>
        </div>

        <div id="footer"></div>
    </div>
    <script src="../js/pedidos.js" type="module"></script>
</body>
</html>
