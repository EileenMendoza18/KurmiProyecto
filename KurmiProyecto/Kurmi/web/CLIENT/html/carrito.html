<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Kurmi</title>
    <link rel="stylesheet" href="../style/carrito.css">
</head>
<body>
    <div class="div__body">
        <div id="header"></div>

        <main id="main">
            <!-- Estado vacío — oculto por defecto, el JS lo muestra si no hay productos -->
            <div class="carrito__vacio hidden">
                <img src="../../RESOURCES/img/carrito.png" alt="Carrito vacío">
                <div class="vacio__info">
                    <h1>Tu carrito esta vacio</h1>
                    <p>Agrega productos para verlos aquí</p>
                    <a href="../html/tienda.html" class="btn__primary">Explorar productos</a>
                </div>
            </div>

            <!-- Contenido del carrito — oculto por defecto, el JS lo muestra si hay productos -->
            <div class="carrito__contenedor hidden">
                
                <section class="carrito__resumen">
                    <h1 class="resumen__titulo">Este es tu carrito de compras</h1>
                    <div class="resumen__imagen-container">
                        <img src="../../RESOURCES/img/carrito.png" alt="Carrito de compras" class="resumen__img">
                    </div>
                    <div class="resumen__total-badge">
                        <span>Total: $0</span>
                    </div>
                </section>

                <section class="carrito__lista-productos">
                    <div class="productos__header">
                        <h2>Productos seleccionados: <span id="contador-productos">0</span></h2>
                    </div>

                    <!-- El JS llena este grid dinámicamente — NO poner tarjetas aquí -->
                    <div class="productos__grid"></div>

                    <div class="productos__footer">
                        <button class="btn__primary btn__comprar">Comprar</button>
                    </div>
                </section>

            </div>
        </main>

        <div id="footer"></div>
    </div>
    <script src="../js/index.js" type="module"></script>
</body>
</html>
