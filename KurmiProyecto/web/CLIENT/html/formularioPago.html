<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Kurmi</title>
    <link rel="stylesheet" href="../style/inicio.css">
    <link rel="stylesheet" href="../style/formularioPago.css">
</head>
<body>
    <div id="header"></div>

    <main class="pago-container">
        <h2>Detalles de tu Pedido</h2>
        
        <div class="resumen-producto" id="resumenCompra">
            Cargando producto elegido...
        </div>

        <form action="/KurmiProyect/ProcesarCompraServlet" method="POST">
            <input type="hidden" id="inputProductoId" name="productoId">
            <input type="hidden" id="inputTotal" name="totalPago">

            <div class="form-group">
                <label for="nombre">Nombre Completo de quien recibe:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="direccion">Dirección de Entrega:</label>
                <input type="text" id="direccion" name="direccion" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono de Contacto:</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>
            <div class="form-group">
                <label for="metodoPago">Método de Pago:</label>
                <select id="metodoPago" name="metodoPago" required>
                    <option value="Daviplata">Daviplata</option>
                    <option value="Nequi">Nequi</option>
                    <option value="Efectivo">Contra Entrega (Efectivo)</option>
                </select>
            </div>

            <button type="submit" class="btn-pagar">Confirmar y Pagar</button>
        </form>
    </main>

    <div id="footer"></div>

    <script type="module" src="../js/formularioPago.js"></script>
</body>
</html>
