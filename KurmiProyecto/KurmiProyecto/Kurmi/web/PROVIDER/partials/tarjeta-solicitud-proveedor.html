<div class="sol-card sol-card--{{estadoClase}}">
    <div class="sol-card__header">
        <div class="sol-card__header-izq">
            <span class="sol-card__tipo">{{tipoIcono}} {{tipo}}</span>
            <span class="badge {{badgeClass}} badge--static">{{badgeIcon}} {{estado}}</span>
        </div>
        <span class="sol-card__fecha">Enviada: {{fechaSolicitud}}</span>
    </div>
    <div class="sol-card__body">
        {{filaCateg}}{{filaRelSabor}}{{filaSabor}}{{filaRelCat}}{{filaDesc}}{{filaMotivo}}{{filaRespuesta}}
    </div>
</div>
