<div class="seccion-header">
    <h2>Mi perfil</h2>
</div>

<div class="perfil-card">
    <div class="perfil-card__fila">
        <div class="perfil-campo">
            <label>Nombres</label>
            <input id="adm-nombres" type="text" readonly />
        </div>
        <div class="perfil-campo">
            <label>Apellidos</label>
            <input id="adm-apellidos" type="text" readonly />
        </div>
    </div>
    <div class="perfil-card__fila">
        <div class="perfil-campo">
            <label>Teléfono</label>
            <input id="adm-telefono" type="text" readonly />
        </div>
        <div class="perfil-campo">
            <label>Correo electrónico</label>
            <input id="adm-correo" type="text" readonly />
        </div>
    </div>
    <div class="perfil-card__fila">
        <div class="perfil-campo">
            <label>Fecha de nacimiento</label>
            <input id="adm-fecha" type="date" readonly />
        </div>
        <div class="perfil-campo">
            <label>Dirección</label>
            <input id="adm-direccion" type="text" readonly />
        </div>
    </div>
    <div class="perfil-card__acciones">
        <button class="btn-primario" id="btnActualizarPerfilAdmin">Actualizar datos</button>
        <button class="btn-cerrar-sesion" id="btnCerrarSesionAdmin">Cerrar sesión</button>
    </div>
</div>
