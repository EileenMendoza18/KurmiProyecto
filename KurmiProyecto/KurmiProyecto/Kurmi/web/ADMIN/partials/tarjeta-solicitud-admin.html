<div class="sol-card">
    <div class="sol-card__header">
        <div class="sol-card__header-left">
            <span class="sol-card__tipo">
                <img src="../../RESOURCES/img/postreAside.png" alt="" class="sol-tipo-icono" />
                <span class="sol-tipo-texto"></span>
            </span>
            <span class="sol-card__proveedor"></span>
        </div>
        <div class="sol-card__header-right">
            <span class="badge badge-estado badge--static"></span>
            <span class="sol-card__fecha"></span>
        </div>
    </div>

    <div class="sol-card__body">
        <p class="sol-card__fila sol-fila-cat"     hidden><span class="sol-card__etiq">Categoría nueva:</span> <span class="sol-val-cat"></span></p>
        <p class="sol-card__fila sol-fila-sabor"   hidden><span class="sol-card__etiq">Sabor nuevo:</span> <span class="sol-val-sabor"></span></p>
        <p class="sol-card__fila sol-fila-relcat"  hidden><span class="sol-card__etiq">Relacionar con categoría:</span> <span class="sol-val-relcat"></span></p>
        <p class="sol-card__fila sol-fila-relsabor" hidden><span class="sol-card__etiq">Relacionar con sabor:</span> <span class="sol-val-relsabor"></span></p>
        <p class="sol-card__fila sol-fila-desc"    hidden><span class="sol-card__etiq">Descripción:</span> <span class="sol-val-desc"></span></p>
        <div class="sol-card__rechazo sol-fila-rechazo" hidden>
            <span class="sol-card__etiq">Motivo del rechazo:</span>
            <p class="sol-val-rechazo"></p>
        </div>
        <p class="sol-card__fecha-resp sol-fila-respuesta" hidden></p>
    </div>

    <div class="sol-card__acciones">
        <button class="btn-estado btn-responder-sol sol-btn-responder" hidden>Responder</button>
        <span class="sol-ya-respondida" hidden>Ya respondida</span>
    </div>
</div>
