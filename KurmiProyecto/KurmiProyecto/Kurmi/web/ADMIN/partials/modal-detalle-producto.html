<div class="mda-overlay" id="mda-root">
    <div class="mda-modal" role="dialog" aria-modal="true">
        <div class="mda-img-wrap">
            <img class="mda-img" src="" alt="" onerror="" />
            <button class="mda-cerrar" id="mdaCerrar" title="Cerrar">✕</button>
        </div>
        <div class="mda-body">
            <p class="mda-nombre"></p>
            <p class="mda-precio"></p>
            <p class="mda-desc"></p>
            <div class="mda-grid">
                <div class="mda-campo">
                    <span class="mda-label">Categoría</span>
                    <span class="mda-valor mda-val-categoria"></span>
                </div>
                <div class="mda-campo">
                    <span class="mda-label">Sabor</span>
                    <span class="mda-valor mda-val-sabor"></span>
                </div>
                <div class="mda-campo">
                    <span class="mda-label">Unidad de medida</span>
                    <span class="mda-valor mda-val-unidad"></span>
                </div>
                <div class="mda-campo">
                    <span class="mda-label">Vence</span>
                    <span class="mda-valor mda-val-vence"></span>
                </div>
                <div class="mda-campo">
                    <span class="mda-label">Stock</span>
                    <span class="mda-valor mda-val-stock"></span>
                </div>
                <div class="mda-campo">
                    <span class="mda-label">Estado</span>
                    <span class="mda-valor mda-badge-row">
                        <span class="mda-estado-dot"></span>
                        <span class="mda-val-estado"></span>
                    </span>
                </div>
                <div class="mda-campo mda-campo--full">
                    <span class="mda-label">Proveedor</span>
                    <span class="mda-valor mda-val-proveedor"></span>
                </div>
            </div>
        </div>
        <div class="mda-footer">
            <button class="mda-btn-estado" id="mdaBtnEstado">Cambiar estado</button>
        </div>
    </div>
</div>
