<!--
    file-upload-field.html — Componente reutilizable: campo de imagen con preview
    ──────────────────────────────────────────────────────────────────────────────
    Renderiza un input type="file" estilizado con etiqueta personalizada y
    un bloque de vista previa que se activa tras seleccionar una imagen.

    Slots:
      · [INPUT_ID]        → id del <input type="file">  (ej: inp-imagen / edit-imagen)
      · [TEXTO_ID]        → id del <span> que muestra el nombre del archivo
      · [PREVIEW_WRAP_ID] → id del wrapper de preview   (ej: preview-wrap / edit-preview-wrap)
      · [PREVIEW_IMG_ID]  → id del <img> de preview     (ej: preview-img  / edit-preview-img)
      · [PREVIEW_INFO_ID] → id del <span> con nombre+tamaño

    El JS que lo activa sigue el patrón ya usado en proveedor.js:
        document.getElementById('[INPUT_ID]').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('[TEXTO_ID]').textContent = file.name;
            document.getElementById('[PREVIEW_IMG_ID]').src   = URL.createObjectURL(file);
            document.getElementById('[PREVIEW_INFO_ID]').textContent =
                `${file.name} · ${(file.size / 1024).toFixed(1)} KB`;
            document.getElementById('[PREVIEW_WRAP_ID]').classList.remove('preview-wrap--oculto');
        });
-->

<div class="input-imagen-wrap">
    <input type="file" id="[INPUT_ID]"
           accept="image/jpeg,image/png,image/webp,image/gif" />
    <label class="file-upload-label" for="[INPUT_ID]">
        <span class="file-upload-label__icon"></span>
        <span class="file-upload-label__texto" id="[TEXTO_ID]">Ningún archivo seleccionado</span>
        <span class="file-upload-label__btn">Seleccionar</span>
    </label>
    <div id="[PREVIEW_WRAP_ID]" class="preview-wrap--oculto">
        <img id="[PREVIEW_IMG_ID]" src="" alt="Vista previa" class="preview-img" />
        <span id="[PREVIEW_INFO_ID]" class="preview-info"></span>
    </div>
</div>
