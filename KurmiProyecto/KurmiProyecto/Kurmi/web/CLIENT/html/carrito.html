<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style/carrito.css">
</head>
<body>
    <div class="div__body">
    <div id="header">
        </div>

    <main id="main">
        <div class="carrito__vacio hidden">
            <img src="../../RESOURCES/img/carrito.png" alt="Carrito vacío">
            <div class="vacio__info">
                <h1>Tu carrito esta vacio</h1>
                <p>Agrega productos para verlos aquí</p>
                <a href="../html/tienda.html" class="btn__primary">Explorar productos</a>
            </div>
        </div>

        <div class="carrito__contenedor">
            
            <section class="carrito__resumen">
                <h1 class="resumen__titulo">Este es tu carrito de compras</h1>
                <div class="resumen__imagen-container">
                    <img src="../../RESOURCES/img/carrito.png" alt="Carrito de compras" class="resumen__img">
                </div>
                <div class="resumen__total-badge">
                    <span>Total: 150.000</span>
                </div>
            </section>

            <section class="carrito__lista-productos">
                <div class="productos__header">
                    <h2>Productos seleccionados: <span id="contador-productos">4</span></h2>
                </div>

                <div class="productos__grid">
                    
                    <div class="producto__card">
                        <div class="card__imagen">
                            <img src="../../RESOURCES/img/inicioHelado.png" alt="postres de maracuy...">
                        </div>
                        <div class="card__detalles">
                            <p class="card__nombre">postres de maracuy...</p>
                            <p class="card__precio">$150.000</p>
                        </div>
                        <div class="card__acciones">
                            <div class="acciones__contador">
                                <button class="btn-cantidad" type="button">-</button>
                                <span class="cantidad-valor">1</span>
                                <button class="btn-cantidad" type="button">+</button>
                            </div>
                            <button class="btn-eliminar" type="button">
                                🗑️
                            </button>
                            <label class="checkbox-container">
                                <input type="checkbox" class="chk-comprar">
                                <span class="custom-checkbox"></span>
                            </label>
                        </div>
                    </div>
                    </div>

                <div class="productos__footer">
                    <button class="btn__primary btn__comprar">Comprar</button>
                </div>
            </section>

        </div>
    </main>

    <div id="footer">
        </div>
</div>
<script src="../js/index.js" type="module"></script>
</body>
</html>
