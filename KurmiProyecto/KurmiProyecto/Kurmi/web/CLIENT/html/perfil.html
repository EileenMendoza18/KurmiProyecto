<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Kurmi</title>
    <link rel="stylesheet" href="../style/perfil.css">
</head>
<body>
    <div class="contenedor-principal">
        <div id="header"></div>
        <main class="perfil-main">
            <section class="perfil__hero">
                <div class="perfil__avatar-wrap">
                    <img src="../../RESOURCES/img/perfil.png" alt="Avatar" class="perfil__avatar">
                </div>
                <h1 class="perfil__bienvenida">Bienvenido(a) a tu perfil, <span id="nombreUsuario">...</span></h1>
            </section>

            <section class="perfil__card">
                <h2 class="perfil__card-titulo">Datos personales</h2>
                <div class="perfil__grid">

                    <div class="perfil__campo">
                        <label>Nombres</label>
                        <input type="text" id="inputNombres" name="nombres" readonly>
                        <span id="errorNombres" class="perfil__error"></span>
                    </div>
                    <div class="perfil__campo">
                        <label>Apellidos</label>
                        <input type="text" id="inputApellidos" name="apellidos" readonly>
                        <span id="errorApellidos" class="perfil__error"></span>
                    </div>

                    <div class="perfil__campo">
                        <label>Teléfono</label>
                        <input type="text" id="inputTelefono" name="telefono" readonly>
                        <span id="errorTelefono" class="perfil__error"></span>
                    </div>
                    <div class="perfil__campo">
                        <label>Correo electrónico</label>
                        <input type="text" id="inputCorreo" name="correo" readonly>
                        <span id="errorCorreo" class="perfil__error"></span>
                    </div>

                    <div class="perfil__campo">
                        <label>Fecha de nacimiento</label>
                        <input type="date" id="inputFecha" name="fechaNacimiento" readonly>
                        <span id="errorFecha" class="perfil__error"></span>
                    </div>
                    <div class="perfil__campo">
                        <label>Dirección</label>
                        <input type="text" id="inputDireccion" name="direccion" readonly>
                        <span id="errorDireccion" class="perfil__error"></span>
                    </div>

                </div>
                <div class="perfil__acciones">
                    <button class="btn__actualizar" id="btnActualizar">Actualizar datos</button>
                </div>
            </section>

            <section class="perfil__nav-botones">
                <button class="btn__nav" id="btnVerPedidos">
                    Ver mis pedidos
                </button>
                <button class="btn__nav btn__nav--activo" id="btnVerFavoritos">
                    Mis favoritos
                </button>
                <button class="btn__nav btn__nav--cerrar" id="btnCerrarSesion">
                    Cerrar sesión
                </button>
            </section>
        </main>
        <div id="footer"></div>
    </div>
    <script src="../js/perfil.js" type="module"></script>
</body>
</html>
